name: codebase-memory-mcp

ddev_version_constraint: '>= v1.24.10'

# No dependencies and no credentials to distribute: the server is reached over
# HTTP on the project's Docker network, so this composes with ddev-ai-workspace
# without touching anything another add-on owns.
dependencies: []

pre_install_actions:
  - |
    #ddev-description:Clearing a stale graph bridge from an earlier version
    # Earlier versions of this file carried "# ddev-generated" — with a space.
    # DDEV matches the exact literal "#ddev-generated" to decide a file is safe to
    # replace, so on upgrade it keeps that old bridge while updating everything
    # around it: the compose file then publishes a UI proxy port the bridge does
    # not serve. Deleting it here (pre_install runs before files are copied) lets
    # the current version land.
    #
    # The test is for the old marker specifically, not merely a missing one —
    # stripping the marker is how DDEV users opt a file out of being overwritten,
    # and that choice must be respected.
    BRIDGE="${DDEV_APPROOT}/.ddev/codebase-memory-build/mcp-http-bridge.py"
    if [ -f "$BRIDGE" ] && grep -q '^# ddev-generated$' "$BRIDGE"; then
      rm -f "$BRIDGE"
      echo "Removed stale mcp-http-bridge.py from an earlier version"
    fi

  - |
    #ddev-description:Checking platform support
    # Upstream publishes linux binaries for amd64 and arm64 only.
    arch="$(uname -m)"
    case "$arch" in
      x86_64|amd64|arm64|aarch64) ;;
      *)
        echo "codebase-memory-mcp has no Linux release for '$arch'."
        echo "Supported: x86_64/amd64, arm64/aarch64."
        exit 1
        ;;
    esac

project_files:
  - docker-compose.codebase-memory.yaml
  # Reachable from any container on the project network, including the AI agent
  # containers, which mount the project but have no ddev binary.
  - codebase-memory/
  # Directory form: everything under it belongs to this add-on, so removal takes
  # the directory with it instead of leaving an empty shell behind.
  - codebase-memory-build/
  - commands/host/cbm

global_files: []

post_install_actions:
  - |
    #ddev-description:Removing superseded graph UI port mapping
    # Earlier versions published the UI through a generated compose file written
    # by `ddev cbm ui on`. The UI is now proxied by the bridge and routed through
    # ddev-router, so that file would publish a port nothing serves — and could
    # block `ddev start` by colliding on the host.
    UI_COMPOSE="${DDEV_APPROOT}/.ddev/docker-compose.codebase-memory-ui.yaml"
    if [ -f "$UI_COMPOSE" ] && grep -q '#ddev-generated' "$UI_COMPOSE"; then
      rm -f "$UI_COMPOSE"
      echo "Removed superseded graph UI port mapping"
    fi
    # CBM_UI was an exposure switch, never a UI on/off switch, and no longer does
    # anything. Drop it so it cannot confuse anyone reading the file.
    ENV_FILE="${DDEV_APPROOT}/.ddev/.env.codebase-memory"
    if [ -f "$ENV_FILE" ] && grep -q '^CBM_UI=' "$ENV_FILE"; then
      sed -i.bak '/^CBM_UI=/d' "$ENV_FILE" && rm -f "${ENV_FILE}.bak"
      echo "Removed obsolete CBM_UI from .ddev/.env.codebase-memory"
    fi

  - |
    #ddev-description:Seeding .cbmignore
    # Without this, DDEV's own config is indexed as if it were application code:
    # the shell functions in this add-on's entrypoint.sh alone accounted for most
    # of the Function nodes in a small test project. Only created when absent, so
    # an existing .cbmignore is never touched.
    if [ ! -e "${DDEV_APPROOT}/.cbmignore" ]; then
      cat > "${DDEV_APPROOT}/.cbmignore" <<'EOF'
    # codebase-memory-mcp ignore file (gitignore syntax).
    # Created by the ddev-codebase-memory-mcp add-on; edit or delete as you like.

    # DDEV configuration and add-on scripts are infrastructure, not application
    # code — indexing them adds noise to every search and trace result.
    .ddev/
    EOF
      echo "Created .cbmignore (excludes .ddev/ from the graph)"
    else
      echo "Kept existing .cbmignore — add '.ddev/' yourself to keep DDEV config out of the graph"
    fi

  - |
    #ddev-description:Installation complete
    echo ""
    echo "=== Codebase Memory MCP installed ==="
    echo ""
    echo "Next step:"
    echo "  ddev restart"
    echo ""
    echo "On first start the project is indexed in the background"
    echo "(follow along with: ddev logs -f -s codebase-memory), and the server"
    echo "is registered for both AI clients:"
    echo "  .mcp.json      -> Claude Code   (ddev claude-code)"
    echo "  opencode.json  -> OpenCode      (ddev opencode)"
    echo ""
    echo "Browse the graph (no agent needed):"
    echo "  http://${DDEV_SITENAME}.ddev.site:9760"
    echo ""
    echo "Handy commands:"
    echo "  ddev cbm index                 # re-index the project"
    echo "  ddev cbm list_projects         # what is in the graph"
    echo "  ddev cbm ui                    # graph UI URL and status"
    echo "  ddev cbm --help                # all tools"
    echo ""
    echo "Inside containers (AI agents, web) the graph is queryable with:"
    echo "  .ddev/codebase-memory/cbm --help"
    echo "Point your agents at .ddev/codebase-memory/AGENT-INSTRUCTIONS.md"
    echo ""

removal_actions:
  - |
    #ddev-description:Deregistering from AI client configs
    # Remove only our own key, and only from valid JSON, so hand-added MCP
    # servers in these shared files survive.
    for f in "${DDEV_APPROOT}/.mcp.json:mcpServers" "${DDEV_APPROOT}/opencode.json:mcp"; do
      file="${f%:*}"
      key="${f##*:}"
      if [ -s "$file" ] && jq -e 'type == "object"' "$file" >/dev/null 2>&1; then
        if jq --arg k "$key" -e '.[$k]["codebase-memory"]' "$file" >/dev/null 2>&1; then
          tmp="$(mktemp "${file}.XXXXXX")"
          if jq --arg k "$key" 'del(.[$k]["codebase-memory"])' "$file" > "$tmp"; then
            mv -f "$tmp" "$file"
            echo "Removed 'codebase-memory' from $(basename "$file")"
          else
            rm -f "$tmp"
          fi
        fi
      fi
    done

  - |
    #ddev-description:Removing generated UI port mapping
    # Written at runtime by `ddev cbm ui on`, so it is not in project_files and
    # DDEV does not clean it up automatically.
    UI_COMPOSE="${DDEV_APPROOT}/.ddev/docker-compose.codebase-memory-ui.yaml"
    if [ -f "$UI_COMPOSE" ] && grep -q '#ddev-generated' "$UI_COMPOSE"; then
      rm -f "$UI_COMPOSE"
      echo "Removed generated graph UI port mapping"
    fi

  - |
    #ddev-description:Cleaning up
    echo ""
    echo "Codebase Memory MCP add-on removed."
    echo ""
    echo "The knowledge graph volume was kept. Delete it with:"
    echo "  docker volume rm ddev-${DDEV_SITENAME}-codebase-memory-cache"
    echo ""
