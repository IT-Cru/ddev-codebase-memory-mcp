name: tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

  schedule:
    - cron: '25 08 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Debug with tmate
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The HTTP bridge is the one piece of protocol code this add-on owns, so it gets
  # its own fast check: standard library only, no Docker and no DDEV, so it runs in
  # seconds and gives a clear signal well before the add-on job finishes.
  bridge:
    name: bridge unit tests (python ${{ matrix.python_version }})
    strategy:
      matrix:
        # 3.12 is what ubuntu:24.04 ships and therefore what actually runs in the
        # container; the neighbours guard against drift if that base image moves.
        python_version: ['3.11', '3.12', '3.13']
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Byte-compile the bridge
        run: python3 -m py_compile codebase-memory-build/mcp-http-bridge.py

      - name: Run bridge tests
        # Fail on ResourceWarning: leaked pipes or sockets in the bridge would
        # otherwise pass silently and only show up as exhaustion under load.
        run: python3 -W error::ResourceWarning -m unittest discover -s tests/bridge -v

  tests:
    strategy:
      matrix:
        ddev_version: [stable, HEAD]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}

      # Without this a failure here is only readable by whoever can open the run
      # logs, and an intermittent one is barely diagnosable at all. `teardown()`
      # exports TESTDIR into GITHUB_ENV for exactly this purpose.
      # See https://github.com/ddev/github-action-add-on-test#preserving-artifacts
      - name: Preserve the test project on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: testdir-${{ matrix.ddev_version }}-${{ github.run_id }}
          path: ${{ env.TESTDIR }}
          if-no-files-found: warn
          retention-days: 7
